[package]
name = "latermd-creds"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cross-platform credential storage via keyring (Credential Manager / Keychain / Secret Service), no UI deps"

[dependencies]
# 三平台系统凭据统一封装(ADR-004 已登记 keyring 4.2.0,decisions-pending
